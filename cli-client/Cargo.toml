[package]
name = "trmnl-console"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/theCapypara/trmnl-console"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
shadow-terminal = "0.2"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
unicode-normalization = "0.1"
tempfile = "3.27"
interprocess = { version = "2.4", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
owo-colors = { version = "4.3", features = ["supports-colors"] }

[dev-dependencies]
# Pinned to 0.7: the 0.8 alphas change the matcher API.
httpmock = "0.7"
# Same version as the transitive dependency via shadow-terminal.
portable-pty = "0.8"
serde_json = "1"
# Plain-HTTP client for the --preview smoke test; no TLS stack needed.
ureq = { version = "3", default-features = false }
wait-timeout = "0.2"

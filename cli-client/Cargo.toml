[package]
name = "trmnl-console"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/theCapypara/trmnl-console"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
shadow-terminal = "0.2"
tokio = { version = "1.53", features = ["full", "rt-multi-thread"]}
unicode-normalization = "0.1"

# Example compose file for trmnl-console-relay.
#
# Usage (from the repository root):
#   cp relay/.env.example relay/.env && edit it (set RELAY_TOKEN)
#   docker compose -f relay/docker-compose.yml up --build -d
#
# Put this behind your reverse proxy (Caddy, nginx, ...) rather than exposing RELAY_PORT
# directly - the polling endpoint's only real protection is the TRMNL IP allowlist, and TLS
# termination belongs at the proxy. See relay/README.md for a Caddy example.

services:
  trmnl-console-relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    container_name: trmnl-console-relay
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${RELAY_PORT:-8901}:8080"
    volumes:
      - relay-data:/data

volumes:
  relay-data:

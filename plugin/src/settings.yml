---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language:
polling_url: "{{ backend_url }}"
polling_headers: ''
polling_body: ''
id: 465528
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: info
  field_type: author_bio
  name: About This Plugin
  description: |
    This plugin displays the output of a console command on your TRMNL device.<br>
    <br>
    Push a terminal snapshot (tmux/Zellij pane, or any command) to a self-hosted
    trmnl-console-backend - this plugin polls it. You can find more information,
    examples and the command at the
    <a href="https://github.com/theCapypara/trmnl-console" target="_blank">repository</a>.
  category: custom,productivity
  github_url: https://github.com/theCapypara/trmnl-console
- keyname: backend_url
  field_type: password
  name: Backend URL
  description: Full URL of your self-hosted trmnl-console-backend, id included (e.g. <code>https://your-host/trmnl-console/&lt;id&gt;</code>).<br> This plugin polls it; push to the same URL with trmnl-console-pusher or <code>trmnl-console --url</code>.<br> The id in the URL is the only credential (same model as a TRMNL webhook URL) - that's why this field is masked and never lives in the plugin recipe's source. See <a href="https://github.com/theCapypara/trmnl-console/tree/main/backend" target="_blank">backend/README.md</a>.
  placeholder: https://your-host/trmnl-console/your-id
  optional: false
name: Console / Terminal Output
description: Display the output of a command
refresh_interval: 15

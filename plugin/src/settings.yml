---
strategy: webhook
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language:
polling_url: ''
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: info
  field_type: author_bio
  name: About This Plugin
  description: |
    This plugin displays the output of a console command on your TRMNL device.<br>
    <br>
    To accomplish this, you will need to run a console command on your PC or
    server. You can find more information, examples and the command at the
    <a href="https://github.com/theCapypara/trmnl-console" target="_blank">repository</a>.
  category: custom,productivity
  github_url: https://github.com/theCapypara/trmnl-console
- keyname: webhook_url
  field_type: copyable_webhook_url
  name: Webhook URL
  description: Use this URL with the `trmnl-console` command.
  help_text: This will populate once the plugin has been created/saved.
name: Console / Terminal Output
description: Display the output of a command
refresh_interval: 15

on:
  push:
    branches: [ main ]
  pull_request:

name: Tests

jobs:
  cli-tests:
    name: Test CLI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test
        working-directory: cli-client
  js-sbuffer-render:
    name: Test JavaScript SBuffer renderer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: run test
        run: node test-shared-liquid.js
        working-directory: plugin
  python-sbuffer-render:
    name: Test Python SBuffer renderer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: run test
        run: python test-transform.py
        working-directory: plugin

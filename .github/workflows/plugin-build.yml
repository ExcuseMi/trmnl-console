on:
  push:
    branches: [ main ]
  pull_request:

name: Plugin Build

jobs:
  plugin-build:
    name: Build plugin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: install trmnlp
        run: gem install trmnl_preview
      - name: create .trmnlp.yml
        run: cp .trmnlp.example.yml .trmnlp.yml
        working-directory: plugin
      - name: trmnlp build
        run: bin/trmnlp build
        working-directory: plugin

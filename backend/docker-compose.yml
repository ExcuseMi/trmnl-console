# Example compose file for trmnl-console-backend.
#
# Usage (from the repository root):
#   docker compose -f backend/docker-compose.yml up --build -d
#
# Put this behind your reverse proxy (Caddy, nginx, ...) rather than exposing BACKEND_PORT
# directly - TLS termination belongs at the proxy. See backend/README.md for a Caddy example.

services:
  trmnl-console-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: trmnl-console-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8901}:8080"
    volumes:
      - backend-data:/data

volumes:
  backend-data:
